  #paper{position:absolute;inset:0;opacity:.5;pointer-events:none;mix-blend-mode:multiply;

  #top{position:absolute;top:48px;left:60px;right:60px;display:flex;align-items:center;gap:18px;z-index:5}
  #ava{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#F0C9A8,#D98E63);

  #tag{margin-left:auto;font-size:24px;font-weight:700;color:var(--terraD);
    background:#F6E7D6;border:1px solid #EAD3BC;padding:9px 20px;border-radius:999px}

  /* card slots */
  .slot{position:absolute;left:60px;right:60px;top:170px;bottom:230px;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;text-align:center;will-change:opacity,transform}
  .art{width:560px;height:430px;margin-top:6px;display:flex;align-items:center;justify-content:center}
  .art svg{width:100%;height:100%;overflow:visible}
  .kicker{margin-top:6px;font-size:27px;font-weight:700;letter-spacing:3px;color:var(--terraD);
    background:#F6E7D6;padding:8px 22px;border-radius:999px}
  .title{margin-top:24px;font-size:62px;line-height:1.22;font-weight:900;max-width:920px}
  .title .hl{color:var(--terraD)}
  .body{margin-top:30px;display:flex;flex-direction:column;gap:18px;align-items:stretch;width:840px}
  .body .li{font-size:38px;font-weight:500;line-height:1.4;color:#4a443d;
    background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 26px;
    box-shadow:0 6px 16px rgba(150,120,80,.06);text-align:left}
  .body .li b{color:var(--terraD);font-weight:700}
  .body.plain .li{background:transparent;border:none;box-shadow:none;padding:6px 0;font-size:40px}

  #subbar{position:absolute;left:90px;right:90px;bottom:120px;z-index:6;text-align:center}
  #sub{display:inline-block;font-size:34px;font-weight:500;line-height:1.4;color:#fff;
    background:rgba(64,58,52,.86);padding:14px 30px;border-radius:18px;max-width:900px;
    box-shadow:0 8px 22px rgba(0,0,0,.18)}

  #prog{position:absolute;left:60px;right:60px;bottom:66px;height:7px;border-radius:4px;background:#EADFCD;z-index:5}
  #progf{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#E0AE5A,#D98E63)}
  #chap{position:absolute;right:60px;bottom:84px;font-size:24px;color:var(--ink2);z-index:5;font-weight:700}

  .footnote{font-size:24px;color:var(--ink2);margin-top:18px}

/* compute start/end with overlap */
(function(){var t=0;for(var i=0;i<SEG.length;i++){SEG[i].start=t;SEG[i].end=t+SEG[i].d;t=SEG[i].end-OVL;}})();
var TOTAL=SEG[SEG.length-1].end;
window.__SCENE__={duration:Math.round(TOTAL*100)/100, fps:24};

/* ---------- rendering ---------- */
function buildCard(seg){
  var bodyCls='body'+(seg.plain?' plain':'');
  var lis='';for(var i=0;i<seg.body.length;i++){lis+='<div class="li" data-i="'+i+'">'+seg.body[i]+'</div>';}
  return '<div class="art">'+ (ART[seg.art]||'') +'</div>'+
         '<div class="kicker">'+seg.kicker+'</div>'+
         '<div class="title">'+seg.title+'</div>'+
         '<div class="'+bodyCls+'">'+lis+'</div>';
}
function alphaOf(seg,t){
  if(t<seg.start||t>seg.end) return 0;
  var a=clamp((t-seg.start)/OVL); var b=clamp((seg.end-t)/OVL);
  return Math.min(a,b);
}

var slots=[document.getElementById('slotA'),document.getElementById('slotB')];

window.seek=function(frame,fps){
  fps=fps||24; var t=frame/fps;

  /* progress + chapter */
  document.getElementById('progf').style.width=(clamp(t/TOTAL)*100).toFixed(2)+'%';

  /* find candidate segments (active alpha>0) */
  var dom=-1,domA=0;
  for(var i=0;i<SEG.length;i++){
    var a=alphaOf(SEG[i],t);
    var slot=slots[i%2];
    if(a>0){
      if(slot.dataset.seg!=String(i)){ slot.innerHTML=buildCard(SEG[i]); slot.dataset.seg=String(i); }
      var ein=clamp((t-SEG[i].start)/0.7);            // enter progress (for slide/stagger)
      var exo=clamp((t-(SEG[i].end-OVL))/OVL);         // exit progress (drift up while leaving)
      slot.style.opacity=a.toFixed(3);
      slot.style.transform='translateY('+(lerp(26,0,eOut(ein)) - exo*26)+'px)';
      slot.style.display='flex'; slot.style.zIndex=(i%2)+1;
      /* stagger body lines */
      var lis=slot.querySelectorAll('.body .li');
      for(var k=0;k<lis.length;k++){
        var lp=eOut(clamp((t-SEG[i].start-0.25-k*0.13)/0.5));
        lis[k].style.opacity=lp.toFixed(3);
        lis[k].style.transform='translateY('+lerp(16,0,lp)+'px)';
      }
      var kik=slot.querySelector('.kicker'); if(kik){var kp=eOut(clamp((t-SEG[i].start)/0.5));kik.style.opacity=kp;}
      var ti=slot.querySelector('.title'); if(ti){var tp=eOut(clamp((t-SEG[i].start-0.08)/0.55));ti.style.opacity=tp;ti.style.transform='translateY('+lerp(14,0,tp)+'px)';}
      var ar=slot.querySelector('.art'); if(ar){var ap=eOutS(clamp((t-SEG[i].start)/0.6));ar.style.opacity=ap;ar.style.transform='scale('+lerp(0.94,1,ap)+')';}
      if(a>domA){domA=a;dom=i;}
    } else {
      if(slot.dataset.seg!=='' && (i%2 === (dom>=0?dom%2:99))){ /* leave as is */ }
    }
  }
  /* hide slots that no segment claims this frame */
  for(var sI=0;sI<2;sI++){
    var claimed=false;
    for(var j=sI;j<SEG.length;j+=2){ if(alphaOf(SEG[j],t)>0){claimed=true;break;} }
    if(!claimed){ slots[sI].style.opacity=0; slots[sI].style.display='none'; }
  }

  /* subtitle from dominant segment */
  var sub=document.getElementById('sub');
  if(dom>=0){
    if(sub.dataset.seg!=String(dom)){ sub.textContent=SEG[dom].sub; sub.dataset.seg=String(dom); }
    sub.parentNode.style.opacity=clamp(domA*1.4).toFixed(3);
    document.getElementById('chap').textContent=(dom+1)+' / '+SEG.length;
  } else { sub.parentNode.style.opacity=0; }
};
window.seek(0,24);
</script>
